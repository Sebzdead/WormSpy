[project]
name = "wormspy"
version = "2.0.0.dev0"
description = "Control software for the WormsPy tracking epifluorescence microscope"
readme = "ReadMe.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Sebastian N. Wittekindt" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",  # also writes FFV1 (behaviour channel), see ADR 0007
    "tifffile>=2024.1",
    "PySide6>=6.7",       # the desktop UI (ADR 0004)
    "pyqtgraph>=0.13",
]

[project.scripts]
wormspy = "wormspy.app.main:main"

[project.optional-dependencies]
# Hardware adapters (ADR 0005). PySpin is not on PyPI: install the wheel shipped with the
# Spinnaker SDK into the environment (`uv pip install <spinnaker_python-*.whl>`).
zaber = ["zaber-motion>=7"]
gamepad = ["pygame>=2.5"]
analysis = ["pandas>=2.1"]       # wormspy.reader: load recordings for analysis

[dependency-groups]
dev = [
    "pyqtgraph>=0.13",
    "pyside6>=6.7",
    "pandas>=2.1",
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "zaber-motion>=10.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
filterwarnings = ["error::RuntimeWarning"]   # numeric problems (overflow, NaN casts) fail tests

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["analysis_code"]  # v1 analysis scripts, until ported (ADR 0007)
