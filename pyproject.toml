[project]
name = "wormspy"
version = "2.0.0.dev0"
description = "Control software for the WormsPy tracking epifluorescence microscope"
readme = "ReadMe.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Sebastian N. Wittekindt" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",  # also writes FFV1 (behaviour channel), see ADR 0007
    "tifffile>=2024.1",
]

[project.optional-dependencies]
# Desktop UI (ADR 0004)
ui = ["PySide6>=6.7", "pyqtgraph>=0.13"]
# Hardware adapters (ADR 0005). PySpin is not on PyPI: install the wheel shipped with the
# Spinnaker SDK into the environment (`uv pip install <spinnaker_python-*.whl>`).
zaber = ["zaber-motion>=7"]
gamepad = ["pygame>=2.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["WormSpy", "analysis_code"]  # legacy v1 code, removed when the rework lands
